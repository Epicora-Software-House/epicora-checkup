name: build

# Doc 02 §8.5: build → testes de regra → assinatura → publicação.
# A etapa de assinatura NÃO existe aqui, e é decisão registrada: ADR-003 decidiu nenhum
# certificado na v1. Publicação em release entra na Fase 3.
#
# Este workflow também é a máquina de build do projeto: .NET Framework 4.7.2 e WinForms
# não compilam em macOS, e o desenvolvimento acontece em Mac. É aqui que se descobre se
# o C# compila.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Invariantes que não dependem de Windows: schema, matriz de regras e as proibições
  # do protótipo PowerShell. São baratos, então rodam primeiro e em paralelo.
  regras:
    name: schema, matriz e protótipo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # validate-schema + validate-rules + check-prototype.
      # Sai diferente de zero em erro; aviso não quebra o build.
      - name: npm run check
        run: npm run check

  motor:
    name: motor de regras (net472, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # O runner traz o targeting pack do 4.7.2 via VS Enterprise 2022, mas a imagem muda
      # sem aviso. src/Directory.Build.props também referencia
      # Microsoft.NETFramework.ReferenceAssemblies, que é o caminho documentado pela
      # Microsoft para não depender disso.
      - name: dotnet --info
        run: dotnet --info

      - name: restore
        run: dotnet restore tests/EpicoraCheckup.Rules.Tests/EpicoraCheckup.Rules.Tests.csproj

      # Compila o grafo inteiro: o projeto de teste referencia Rules, que referencia Core.
      - name: build
        run: dotnet build tests/EpicoraCheckup.Rules.Tests/EpicoraCheckup.Rules.Tests.csproj --configuration Release --no-restore

      # O runsettings fixa a plataforma de execução em x64. Sem isso o vstest pode
      # escolher x86 para assembly de .NET Framework e falhar ao carregar um binário x64,
      # com uma mensagem que não parece ter nada a ver com a causa.
      - name: testes
        run: dotnet test tests/EpicoraCheckup.Rules.Tests/EpicoraCheckup.Rules.Tests.csproj --configuration Release --no-build --settings tests/x64.runsettings --logger "console;verbosity=normal"

      # Os testes gravam documentos de exemplo em tests/generated/. Não existe validador de
      # JSON Schema decente e gratuito para net472, então quem confere é o mesmo ajv que já
      # cobre as fixtures. É isto que prova que a saída do C# está no schema 1.0 — sem isso,
      # "monta o documento" seria afirmação sem verificação.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: saída no schema 1.0
        shell: pwsh
        run: |
          $amostras = Get-ChildItem tests/generated/*.json -ErrorAction SilentlyContinue
          if (-not $amostras) { throw "os testes não geraram amostra em tests/generated/" }
          node tools/validate-schema.mjs @($amostras.FullName)

  # Coletores. Job separado do motor de propósito: é a parte que toca a máquina do
  # cliente, e roda em paralelo com o motor em vez de esperar por ele.
  #
  # O que estes testes cobrem é a DERIVAÇÃO — o que a ferramenta conclui a partir do que a
  # máquina respondeu. As fontes (WMI, registro, fsutil) não são simuladas: elas são
  # exercitadas em campo, com a sonda.
  coletores:
    name: coletores (net472, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: restore
        run: dotnet restore tests/EpicoraCheckup.Collectors.Tests/EpicoraCheckup.Collectors.Tests.csproj

      - name: build
        run: dotnet build tests/EpicoraCheckup.Collectors.Tests/EpicoraCheckup.Collectors.Tests.csproj --configuration Release --no-restore

      # O --settings não é opcional: sem ele o vstest pode escolher x86 para assembly de
      # .NET Framework e falhar ao carregar um binário x64.
      - name: testes
        run: dotnet test tests/EpicoraCheckup.Collectors.Tests/EpicoraCheckup.Collectors.Tests.csproj --configuration Release --no-build --settings tests/x64.runsettings --logger "console;verbosity=normal"

  # O projeto App não é referenciado por nenhum teste, então os jobs acima NÃO o compilam.
  # Este job existe para isso, e para produzir o pacote que vai para quem testa.
  # Depende dos dois: motor ou coletor vermelho não gera executável.
  app:
    name: executável WinForms
    runs-on: windows-latest
    needs: [motor, coletores]
    outputs:
      # Consumido pelo job release: o corpo do release cita a versão que o binário afirma ter.
      versao: ${{ steps.identidade.outputs.versao }}
    steps:
      - uses: actions/checkout@v4

      # Versionamento semântico, e o número vai gravado no JSON de saída (doc 02 §8.5):
      # sem isso é impossível auditar qual versão produziu qual relatório, e isso importa no
      # primeiro relatório contestado por um cliente.
      #
      # Em tag v* a versão é a da tag. Fora de tag é a de desenvolvimento fixada em
      # src/Directory.Build.props, e o commit é o que distingue dois builds dela — por isso
      # o SourceRevisionId entra sempre. O SDK o deposita no AssemblyInformationalVersion
      # como sufixo "+sha", que é de onde ToolIdentity.Commit o lê.
      - name: versão e commit
        id: identidade
        shell: pwsh
        run: |
          $props = "-p:SourceRevisionId=$($env:GITHUB_SHA.Substring(0, 7))"

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = [regex]::Match($env:GITHUB_REF, '^refs/tags/v(\d+\.\d+\.\d+)$')

            # Tag fora do padrão publicaria um release cujo binário afirma ser a versão de
            # desenvolvimento — e é essa versão que vai gravada em todo relatório que ele
            # produzir. Falhar aqui é melhor que descobrir no relatório do cliente.
            if (-not $tag.Success) {
              throw "tag $($env:GITHUB_REF) fora do padrão vN.N.N — a versão do relatório sai do número da tag (doc 02 §8.5)"
            }

            $props = "-p:Version=$($tag.Groups[1].Value) $props"
            "versao=$($tag.Groups[1].Value)" >> $env:GITHUB_OUTPUT
          }

          "props=$props" >> $env:GITHUB_OUTPUT
          Write-Host "carimbo: $props"

      # A mesclagem acontece dentro do publish, no alvo ExecutavelUnico do csproj
      # (ADR-013). Sai um EpicoraCheckup.exe com os quatro assemblies do projeto, o
      # Newtonsoft.Json e a matriz de regras dentro.
      - name: publish
        run: dotnet publish src/EpicoraCheckup.App/EpicoraCheckup.App.csproj --configuration Release --output publish ${{ steps.identidade.outputs.props }}

      # Se a mesclagem falhar, o publish ainda produz um exe — só que dependente das DLLs
      # ao lado. Ele rodaria no runner e quebraria na máquina do cliente, que é o pior
      # lugar para descobrir. Então o pacote só se monta com a prova de que sobrou um
      # arquivo só.
      - name: conferir que é executável único
        shell: pwsh
        run: |
          $sobrando = Get-ChildItem publish -Filter *.dll
          if ($sobrando) { throw "a mesclagem não aconteceu: $($sobrando.Name -join ', ')" }

          $exe = Get-Item publish/EpicoraCheckup.exe
          if ($exe.Length -lt 800KB) { throw "EpicoraCheckup.exe tem $($exe.Length) bytes — pequeno demais para conter a matriz e o Newtonsoft" }

          Write-Host "EpicoraCheckup.exe: $([math]::Round($exe.Length / 1MB, 2)) MB"

      # O carimbo tem que sobreviver à mesclagem: o ILRepack preserva os atributos do
      # assembly primário, e é disso que tool.version e tool.commit saem no relatório. Se
      # essa passagem quebrar, o relatório sai sem procedência e nada mais reclama.
      - name: conferir o carimbo de versão e commit
        shell: pwsh
        run: |
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path publish/EpicoraCheckup.exe))
          Write-Host "FileVersion: $($info.FileVersion) · ProductVersion: $($info.ProductVersion)"

          if ($info.ProductVersion -notmatch '\+[0-9a-f]{7}$') {
            throw "o commit não ficou no assembly (ProductVersion: $($info.ProductVersion)) — tool.commit sairia nulo no relatório"
          }

          $versao = '${{ steps.identidade.outputs.versao }}'
          if ($versao -and $info.FileVersion -notlike "$versao*") {
            throw "a tag pede versão $versao e o binário diz $($info.FileVersion)"
          }

      - name: montar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacote | Out-Null
          Copy-Item publish/EpicoraCheckup.exe pacote/ -Force

          # As fixtures são o único acessório que sobrou, e só servem ao modo demonstração
          # — revisão de tela e de texto no escritório. O técnico em campo usa o .exe sozinho.
          New-Item -ItemType Directory -Force -Path pacote/fixtures | Out-Null
          Copy-Item tests/fixtures/*.json pacote/fixtures/ -Force

          # SHA-256 ao lado do binário: doc 02 §8.4, mitigação 2. Sem certificado de
          # assinatura (ADR-003), é o que permite conferir que o arquivo baixado é o que o
          # CI produziu.
          $hash = (Get-FileHash pacote/EpicoraCheckup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  EpicoraCheckup.exe" | Set-Content -Path pacote/EpicoraCheckup.exe.sha256 -Encoding ASCII

          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path pacote/EpicoraCheckup.exe))

          @"
          Epicora Checkup — pacote de teste

          Este pacote NAO e uma release. Nao esta assinado, e o SmartScreen vai
          reclamar de aplicativo nao reconhecido (doc 02 §8.4 — e esperado, nao e defeito).
          Em "Mais informacoes" > "Executar assim mesmo".

          E UM ARQUIVO SO. Basta o EpicoraCheckup.exe: a matriz de regras vai dentro
          dele. Copie para a maquina, execute, e pronto.

              EpicoraCheckup.exe

          Grava JSON, HTML e log em .\EpicoraCheckup\<CLIENTE>\, ao lado de onde o
          executavel estiver.

          Roda com e sem privilegio de administrador. Sem ele, TPM, BitLocker e a
          verificacao SMART do disco aparecem como "nao foi possivel verificar" — o
          relatorio sai parcial e honesto, nao sai errado.

          SHA-256 do binario: $hash
          Confira com:  Get-FileHash EpicoraCheckup.exe -Algorithm SHA256

          Versao deste binario: $($info.ProductVersion)
          O numero antes do "+" e a versao, o depois e o commit que a produziu. Os
          dois vao gravados no JSON de saida, em tool.version e tool.commit.

          A tela 1 consulta o release mais recente publicado e avisa se esta copia
          estiver atras dele. Neste pacote isso e esperado: pacote de teste carrega
          versao de desenvolvimento, nao a da tag. O aviso nao bloqueia nada, e sem
          rede a verificacao apenas nao acontece.

          --------------------------------------------------------------------

          Modo demonstracao, para revisar telas e textos sem tocar nesta maquina e
          sem gravar arquivo nenhum:

              EpicoraCheckup.exe --demonstracao fixtures\sintetica-vermelha.json

              sintetica-verde.json      maquina saudavel, nenhum achado
              sintetica-amarela.json    execucao SEM elevacao, etapas ignoradas
              sintetica-vermelha.json   achados criticos, veredito Substituir

          Para trocar a matriz sem recompilar, coloque uma pasta rules\ ao lado do
          executavel: ela tem precedencia sobre a embutida, e o log registra qual foi
          usada.

          A matriz tem 61 regras e 23 habilitadas: a lista de riscos ainda sai curta
          de proposito. As outras 38 aguardam texto aprovado pelo comercial ou
          validacao de fonte em campo.

          --------------------------------------------------------------------

          A janela e o relatorio usam a identidade visual da Epicora (ADR-016). A
          tipografia e a Alexandria, sob SIL Open Font License 1.1 — o texto da
          licenca viaja dentro do executavel e no rodape de cada relatorio HTML.

          E a PRIMEIRA vez que a tipografia roda em Windows. Se algum titulo sair
          em Arial, ou se o texto de um cartao da tela 3 terminar cortado, mande
          uma captura de tela: e o ponto que este pre-voo precisa conferir.
          "@ | Set-Content -Path pacote/LEIA-ME.txt -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: EpicoraCheckup-teste
          path: pacote/
          if-no-files-found: error

  # Publicação em release, só em tag v* (doc 02 §8.1).
  #
  # É o que dá a URL estável de download:
  #   https://github.com/<owner>/<repo>/releases/latest/download/EpicoraCheckup.exe
  #
  # Ela resolve sempre para o binário mais recente, sem mudar de endereço a cada versão —
  # o que permite guiar o técnico por telefone com um link só. Depende de o nome do asset
  # ser fixo entre releases, e é por isso que o AssemblyName não carrega número de versão.
  release:
    name: publicar release
    runs-on: ubuntu-latest
    needs: app
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # Escopo mínimo, e só neste job: os outros seguem com contents: read.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EpicoraCheckup-teste
          path: pacote

      - name: publicar
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pacote/EpicoraCheckup.exe
            pacote/EpicoraCheckup.exe.sha256
          body: |
            Arquivo único, sem instalação. Baixe o `EpicoraCheckup.exe` e execute.

            Versão **${{ needs.app.outputs.versao }}**, gravada em `tool.version` no JSON de
            cada relatório junto com o commit que produziu este binário. É o que permite
            auditar qual versão produziu qual relatório.

            **Não é assinado** (ADR-003): o SmartScreen vai avisar que o aplicativo não é
            reconhecido. É esperado — em "Mais informações" > "Executar assim mesmo".
            Confira o SHA-256 publicado ao lado antes de executar.

            A ferramenta compara a própria versão com o release mais recente na abertura e
            avisa, sem bloquear, quando há versão mais nova. Sem rede a verificação apenas
            não acontece.

            Se o EDR do cliente bloquear o executável, o caminho alternativo é o protótipo
            PowerShell em `tools/prototype/` (ADR-009).
